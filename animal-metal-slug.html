<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Metal Slug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        #gameCanvas {
            border: 3px solid #444;
            image-rendering: pixelated;
            background: #87CEEB;
        }
        #ui {
            color: #fff;
            width: 800px;
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }
        #startScreen {
            position: absolute;
            color: #fff;
            text-align: center;
            z-index: 10;
        }
        #startScreen h1 {
            font-size: 48px;
            color: #ff4444;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000;
            margin-bottom: 10px;
        }
        #startScreen h2 {
            font-size: 20px;
            color: #ffcc00;
            margin-bottom: 30px;
        }
        #startScreen .char-select {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 30px;
        }
        #startScreen .char-option {
            cursor: pointer;
            padding: 15px 25px;
            border: 3px solid #555;
            border-radius: 10px;
            transition: all 0.2s;
            background: rgba(0,0,0,0.5);
        }
        #startScreen .char-option:hover, #startScreen .char-option.selected {
            border-color: #ffcc00;
            background: rgba(255,204,0,0.2);
            transform: scale(1.05);
        }
        #startScreen .char-option .emoji { font-size: 64px; }
        #startScreen .char-option .name { font-size: 18px; color: #fff; margin-top: 5px; }
        #startScreen .char-option .desc { font-size: 11px; color: #aaa; margin-top: 3px; }
        .start-btn {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 15px 50px;
            font-size: 22px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .start-btn:hover { background: #ff6666; }
        .controls-info {
            color: #888;
            font-size: 12px;
            margin-top: 20px;
        }
        #gameOver {
            position: absolute;
            color: #fff;
            text-align: center;
            z-index: 10;
            display: none;
        }
        #gameOver h1 { font-size: 52px; color: #ff4444; text-shadow: 3px 3px 0 #000; }
        #gameOver p { font-size: 20px; margin: 15px 0; color: #ffcc00; }
    </style>
</head>
<body>

<div id="startScreen">
    <h1>ANIMAL METAL SLUG</h1>
    <h2>Elige tu guerrero</h2>
    <div class="char-select">
        <div class="char-option selected" onclick="selectChar('dog')">
            <div class="emoji">&#x1F415;</div>
            <div class="name">RAMBO DOG</div>
            <div class="desc">Velocidad alta | Vida media</div>
        </div>
        <div class="char-option" onclick="selectChar('cat')">
            <div class="emoji">&#x1F408;</div>
            <div class="name">NINJA CAT</div>
            <div class="desc">Salto alto | Disparo rapido</div>
        </div>
    </div>
    <button class="start-btn" onclick="startGame()">INICIAR MISION</button>
    <div class="controls-info">
        WASD / Flechas: Mover | ESPACIO: Disparar | W/Arriba: Saltar
    </div>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Puntuacion: <span id="finalScore">0</span></p>
    <p>Nivel alcanzado: <span id="finalLevel">1</span></p>
    <button class="start-btn" onclick="restartGame()">REINTENTAR</button>
</div>

<div id="ui">
    <span>VIDA: <span id="hpBar">&#9608;&#9608;&#9608;&#9608;&#9608;</span></span>
    <span>PUNTOS: <span id="score">0</span></span>
    <span>NIVEL: <span id="level">1</span></span>
    <span>ENEMIGOS: <span id="enemyCount">0</span></span>
</div>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 500;
const GROUND_Y = H - 60;

let selectedChar = 'dog';
let gameRunning = false;
let score = 0;
let level = 1;
let enemiesKilled = 0;
let enemiesForNextLevel = 10;
let cameraX = 0;

// Input
const keys = {};
document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });

function selectChar(c) {
    selectedChar = c;
    document.querySelectorAll('.char-option').forEach(el => el.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
}

// Pixel art drawing helpers
function drawPixelChar(x, y, type, facing, frame, isHurt) {
    ctx.save();
    const drawX = x - cameraX;
    if (facing === -1) {
        ctx.translate(drawX + 20, 0);
        ctx.scale(-1, 1);
        ctx.translate(-20, 0);
    } else {
        ctx.translate(drawX, 0);
    }

    const bounce = Math.sin(frame * 0.3) * 2;
    const ty = y + (type === 'cat' ? bounce * 0.5 : bounce);

    if (isHurt) {
        ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.02) * 0.5;
    }

    if (type === 'dog') {
        // Body
        ctx.fillStyle = '#c4813d';
        ctx.fillRect(5, ty - 28, 30, 22);
        // Head
        ctx.fillStyle = '#d4914d';
        ctx.fillRect(10, ty - 42, 22, 18);
        // Ears
        ctx.fillStyle = '#a06020';
        ctx.fillRect(8, ty - 50, 8, 12);
        ctx.fillRect(24, ty - 50, 8, 12);
        // Eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(14, ty - 38, 4, 4);
        ctx.fillRect(24, ty - 38, 4, 4);
        // Nose
        ctx.fillStyle = '#333';
        ctx.fillRect(18, ty - 32, 6, 3);
        // Legs
        ctx.fillStyle = '#b07030';
        ctx.fillRect(8, ty - 6, 8, 12);
        ctx.fillRect(24, ty - 6, 8, 12);
        // Bandana (red)
        ctx.fillStyle = '#ff2222';
        ctx.fillRect(8, ty - 30, 26, 4);
        // Gun
        ctx.fillStyle = '#555';
        ctx.fillRect(32, ty - 22, 16, 5);
        ctx.fillStyle = '#333';
        ctx.fillRect(44, ty - 23, 6, 7);
        // Tail
        ctx.fillStyle = '#c4813d';
        ctx.fillRect(0, ty - 24, 6, 4 + Math.sin(frame * 0.2) * 3);
    } else {
        // Cat body
        ctx.fillStyle = '#666';
        ctx.fillRect(8, ty - 26, 26, 20);
        // Head
        ctx.fillStyle = '#777';
        ctx.fillRect(10, ty - 42, 22, 20);
        // Ears (pointy)
        ctx.fillStyle = '#555';
        ctx.beginPath();
        ctx.moveTo(10, ty - 42);
        ctx.lineTo(6, ty - 56);
        ctx.lineTo(16, ty - 42);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(26, ty - 42);
        ctx.lineTo(36, ty - 56);
        ctx.lineTo(32, ty - 42);
        ctx.fill();
        // Inner ears
        ctx.fillStyle = '#ffaaaa';
        ctx.beginPath();
        ctx.moveTo(11, ty - 42);
        ctx.lineTo(9, ty - 52);
        ctx.lineTo(15, ty - 42);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(27, ty - 42);
        ctx.lineTo(33, ty - 52);
        ctx.lineTo(31, ty - 42);
        ctx.fill();
        // Eyes (green ninja)
        ctx.fillStyle = '#00ff44';
        ctx.fillRect(14, ty - 36, 5, 4);
        ctx.fillRect(24, ty - 36, 5, 4);
        ctx.fillStyle = '#000';
        ctx.fillRect(16, ty - 35, 2, 3);
        ctx.fillRect(26, ty - 35, 2, 3);
        // Ninja mask
        ctx.fillStyle = '#222';
        ctx.fillRect(8, ty - 34, 28, 4);
        // Whiskers
        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(10, ty - 28); ctx.lineTo(0, ty - 30);
        ctx.moveTo(10, ty - 26); ctx.lineTo(0, ty - 24);
        ctx.moveTo(32, ty - 28); ctx.lineTo(42, ty - 30);
        ctx.moveTo(32, ty - 26); ctx.lineTo(42, ty - 24);
        ctx.stroke();
        // Legs
        ctx.fillStyle = '#555';
        ctx.fillRect(10, ty - 6, 7, 12);
        ctx.fillRect(25, ty - 6, 7, 12);
        // Tail
        ctx.fillStyle = '#666';
        const tailWave = Math.sin(frame * 0.15) * 8;
        ctx.fillRect(0, ty - 22, 5, 3);
        ctx.fillRect(-3, ty - 24 + tailWave, 5, 3);
        // Shuriken gun
        ctx.fillStyle = '#888';
        ctx.fillRect(32, ty - 20, 14, 4);
        ctx.fillStyle = '#aaa';
        ctx.fillRect(42, ty - 22, 5, 8);
    }

    ctx.restore();
}

function drawEnemy(x, y, type, frame, hp, maxHp) {
    const drawX = x - cameraX;
    ctx.save();
    const bounce = Math.sin(frame * 0.25) * 2;

    if (type === 'rat') {
        // Rat soldier
        ctx.fillStyle = '#8B7355';
        ctx.fillRect(drawX + 5, y - 22 + bounce, 22, 18);
        ctx.fillStyle = '#9B8365';
        ctx.fillRect(drawX + 8, y - 34 + bounce, 18, 14);
        // Ears
        ctx.fillStyle = '#C0A080';
        ctx.beginPath();
        ctx.arc(drawX + 10, y - 34 + bounce, 5, 0, Math.PI * 2);
        ctx.arc(drawX + 24, y - 34 + bounce, 5, 0, Math.PI * 2);
        ctx.fill();
        // Eyes (red, evil)
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(drawX + 11, y - 30 + bounce, 3, 3);
        ctx.fillRect(drawX + 20, y - 30 + bounce, 3, 3);
        // Helmet
        ctx.fillStyle = '#556B2F';
        ctx.fillRect(drawX + 6, y - 38 + bounce, 22, 6);
        // Gun
        ctx.fillStyle = '#444';
        ctx.fillRect(drawX - 6, y - 18 + bounce, 14, 4);
        // Legs
        ctx.fillStyle = '#7B6345';
        ctx.fillRect(drawX + 8, y - 4, 6, 10);
        ctx.fillRect(drawX + 20, y - 4, 6, 10);
    } else if (type === 'snake') {
        // Snake (sinuous)
        ctx.fillStyle = '#2E8B57';
        for (let i = 0; i < 5; i++) {
            const sx = drawX + i * 10;
            const sy = y - 10 + Math.sin(frame * 0.2 + i) * 5;
            ctx.fillRect(sx, sy, 12, 10);
        }
        // Head
        ctx.fillStyle = '#3CB371';
        ctx.fillRect(drawX + 45, y - 16 + Math.sin(frame * 0.2) * 3, 14, 14);
        // Eyes
        ctx.fillStyle = '#ff0';
        ctx.fillRect(drawX + 52, y - 14 + Math.sin(frame * 0.2) * 3, 4, 4);
        // Fangs
        ctx.fillStyle = '#fff';
        ctx.fillRect(drawX + 56, y - 6 + Math.sin(frame * 0.2) * 3, 2, 5);
    } else if (type === 'hawk') {
        // Hawk bomber
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(drawX + 5, y - 10 + bounce, 30, 12);
        // Wings
        ctx.fillStyle = '#A0522D';
        const wingFlap = Math.sin(frame * 0.3) * 8;
        ctx.fillRect(drawX - 10, y - 14 + bounce - wingFlap, 20, 6);
        ctx.fillRect(drawX + 30, y - 14 + bounce + wingFlap, 20, 6);
        // Head
        ctx.fillStyle = '#CD853F';
        ctx.fillRect(drawX + 32, y - 16 + bounce, 12, 10);
        // Beak
        ctx.fillStyle = '#ff8c00';
        ctx.fillRect(drawX + 42, y - 12 + bounce, 8, 4);
        // Eye
        ctx.fillStyle = '#ff0';
        ctx.fillRect(drawX + 36, y - 14 + bounce, 3, 3);
        // Bomb
        ctx.fillStyle = '#333';
        ctx.fillRect(drawX + 16, y + 2 + bounce, 8, 6);
    } else if (type === 'boss') {
        // Boss: Giant armored bear
        ctx.fillStyle = '#4a3728';
        ctx.fillRect(drawX, y - 60 + bounce, 55, 50);
        // Head
        ctx.fillStyle = '#5a4738';
        ctx.fillRect(drawX + 10, y - 80 + bounce, 36, 24);
        // Ears
        ctx.fillStyle = '#3a2718';
        ctx.fillRect(drawX + 8, y - 86 + bounce, 10, 10);
        ctx.fillRect(drawX + 38, y - 86 + bounce, 10, 10);
        // Armor
        ctx.fillStyle = '#777';
        ctx.fillRect(drawX + 5, y - 55 + bounce, 46, 15);
        ctx.fillStyle = '#999';
        ctx.fillRect(drawX + 15, y - 52 + bounce, 8, 8);
        ctx.fillRect(drawX + 33, y - 52 + bounce, 8, 8);
        // Eyes (glowing red)
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(drawX + 18, y - 74 + bounce, 6, 5);
        ctx.fillRect(drawX + 32, y - 74 + bounce, 6, 5);
        // Mouth
        ctx.fillStyle = '#200';
        ctx.fillRect(drawX + 20, y - 64 + bounce, 16, 5);
        ctx.fillStyle = '#fff';
        ctx.fillRect(drawX + 22, y - 64 + bounce, 3, 4);
        ctx.fillRect(drawX + 31, y - 64 + bounce, 3, 4);
        // Arms with weapons
        ctx.fillStyle = '#4a3728';
        ctx.fillRect(drawX - 12, y - 45 + bounce, 14, 10);
        ctx.fillRect(drawX + 53, y - 45 + bounce, 14, 10);
        // Gatling gun
        ctx.fillStyle = '#555';
        ctx.fillRect(drawX + 55, y - 44 + bounce, 24, 3);
        ctx.fillRect(drawX + 55, y - 40 + bounce, 24, 3);
        ctx.fillRect(drawX + 55, y - 36 + bounce, 24, 3);
        // Legs
        ctx.fillStyle = '#3a2718';
        ctx.fillRect(drawX + 8, y - 10, 14, 16);
        ctx.fillRect(drawX + 34, y - 10, 14, 16);
    }

    // Health bar
    if (type !== 'boss') {
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(drawX + 2, y - 44, 28, 3);
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(drawX + 2, y - 44, 28 * (hp / maxHp), 3);
    }

    ctx.restore();
}

// Particles
let particles = [];
function addParticle(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * speed,
            vy: (Math.random() - 1) * speed,
            life: 30 + Math.random() * 20,
            color,
            size: 2 + Math.random() * 3
        });
    }
}

function addExplosion(x, y) {
    addParticle(x, y, '#ff4400', 15, 6);
    addParticle(x, y, '#ffcc00', 10, 4);
    addParticle(x, y, '#ff8800', 8, 5);
}

// Game objects
let player, bullets, enemies, enemyBullets, pickups, platforms;

function initGame() {
    player = {
        x: 100, y: GROUND_Y, w: 40, h: 50,
        vx: 0, vy: 0,
        hp: selectedChar === 'dog' ? 5 : 4,
        maxHp: selectedChar === 'dog' ? 5 : 4,
        speed: selectedChar === 'dog' ? 4.5 : 3.8,
        jumpPower: selectedChar === 'cat' ? -14 : -12,
        fireRate: selectedChar === 'cat' ? 6 : 10,
        fireCooldown: 0,
        facing: 1,
        frame: 0,
        onGround: false,
        hurtTimer: 0,
        type: selectedChar
    };
    bullets = [];
    enemies = [];
    enemyBullets = [];
    pickups = [];
    particles = [];
    platforms = [];
    score = 0;
    level = 1;
    enemiesKilled = 0;
    enemiesForNextLevel = 10;
    cameraX = 0;
    spawnTimer = 0;
    bossSpawned = false;
    bossDefeated = false;

    generatePlatforms();
}

function generatePlatforms() {
    platforms = [];
    for (let i = 0; i < 40; i++) {
        platforms.push({
            x: 300 + i * 250 + Math.random() * 150,
            y: GROUND_Y - 80 - Math.random() * 100,
            w: 60 + Math.random() * 60,
            h: 12
        });
    }
}

let spawnTimer = 0;
let bossSpawned = false;
let bossDefeated = false;

function spawnEnemy() {
    const types = ['rat', 'rat', 'rat', 'snake'];
    if (level >= 2) types.push('hawk', 'hawk');
    if (level >= 3) types.push('snake', 'hawk');

    const type = types[Math.floor(Math.random() * types.length)];
    const ex = player.x + W + Math.random() * 200;
    let ey = GROUND_Y;
    let hp = 2 + level;
    let speed = 1 + level * 0.3;

    if (type === 'hawk') {
        ey = 80 + Math.random() * 150;
        hp = 2 + level;
        speed = 1.5 + level * 0.2;
    } else if (type === 'snake') {
        hp = 3 + level;
        speed = 0.8 + level * 0.2;
    }

    enemies.push({
        x: ex, y: ey, w: type === 'snake' ? 60 : (type === 'hawk' ? 40 : 32),
        h: type === 'snake' ? 15 : (type === 'hawk' ? 20 : 38),
        type, hp, maxHp: hp, speed,
        frame: Math.random() * 100,
        fireTimer: Math.random() * 60 + 30,
        alive: true
    });
}

function spawnBoss() {
    enemies.push({
        x: player.x + W + 50, y: GROUND_Y,
        w: 55, h: 70, type: 'boss',
        hp: 30 + level * 15, maxHp: 30 + level * 15,
        speed: 0.8, frame: 0,
        fireTimer: 0, alive: true,
        phase: 0
    });
    bossSpawned = true;
}

function update() {
    if (!gameRunning) return;

    // Input
    let moveX = 0;
    if (keys['a'] || keys['A'] || keys['ArrowLeft']) { moveX = -1; player.facing = -1; }
    if (keys['d'] || keys['D'] || keys['ArrowRight']) { moveX = 1; player.facing = 1; }

    player.vx = moveX * player.speed;
    player.x += player.vx;

    if ((keys['w'] || keys['W'] || keys['ArrowUp']) && player.onGround) {
        player.vy = player.jumpPower;
        player.onGround = false;
    }

    // Gravity
    player.vy += 0.7;
    player.y += player.vy;

    // Platform collision
    player.onGround = false;
    if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.vy = 0;
        player.onGround = true;
    }

    for (const p of platforms) {
        if (player.vy > 0 &&
            player.x + player.w > p.x && player.x < p.x + p.w &&
            player.y >= p.y && player.y - player.vy < p.y + 5) {
            player.y = p.y;
            player.vy = 0;
            player.onGround = true;
        }
    }

    // Keep player in bounds (can't go left of camera)
    if (player.x < cameraX + 10) player.x = cameraX + 10;

    player.frame++;
    if (player.hurtTimer > 0) player.hurtTimer--;

    // Shoot
    if (player.fireCooldown > 0) player.fireCooldown--;
    if (keys[' '] && player.fireCooldown <= 0) {
        bullets.push({
            x: player.x + (player.facing === 1 ? player.w : 0),
            y: player.y - 22,
            vx: player.facing * 10,
            w: 8, h: 3,
            damage: 1
        });
        player.fireCooldown = player.fireRate;
        addParticle(player.x + (player.facing === 1 ? player.w + 5 : -5),
            player.y - 22, '#ffcc00', 3, 2);
    }

    // Camera
    const targetCamX = player.x - W * 0.35;
    cameraX += (targetCamX - cameraX) * 0.08;
    if (cameraX < 0) cameraX = 0;

    // Spawn enemies
    spawnTimer++;
    const spawnRate = Math.max(30, 90 - level * 10);
    if (spawnTimer >= spawnRate && !bossSpawned) {
        spawnEnemy();
        spawnTimer = 0;
    }

    // Check for boss spawn
    if (enemiesKilled >= enemiesForNextLevel && !bossSpawned) {
        spawnBoss();
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].x += bullets[i].vx;
        if (bullets[i].x < cameraX - 50 || bullets[i].x > cameraX + W + 50) {
            bullets.splice(i, 1);
        }
    }

    // Update enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        enemyBullets[i].x += enemyBullets[i].vx;
        enemyBullets[i].y += (enemyBullets[i].vy || 0);

        // Hit player
        if (player.hurtTimer <= 0 && rectsOverlap(enemyBullets[i], {x: player.x, y: player.y - player.h, w: player.w, h: player.h})) {
            player.hp--;
            player.hurtTimer = 60;
            addParticle(player.x + 20, player.y - 20, '#ff0000', 8, 3);
            enemyBullets.splice(i, 1);
            if (player.hp <= 0) gameOver();
            continue;
        }

        if (enemyBullets[i].x < cameraX - 50 || enemyBullets[i].x > cameraX + W + 50 ||
            enemyBullets[i].y > H) {
            enemyBullets.splice(i, 1);
        }
    }

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.frame++;

        if (e.type === 'hawk') {
            e.x -= e.speed;
            e.y += Math.sin(e.frame * 0.05) * 1.5;
        } else if (e.type === 'boss') {
            // Boss AI
            const distToPlayer = player.x - e.x;
            if (Math.abs(distToPlayer) > 150) {
                e.x += Math.sign(distToPlayer) * e.speed;
            }
            e.fireTimer++;
            if (e.fireTimer > 25) {
                e.fireTimer = 0;
                // Triple shot
                for (let a = -1; a <= 1; a++) {
                    enemyBullets.push({
                        x: e.x, y: e.y - 40,
                        vx: Math.sign(player.x - e.x) * 5,
                        vy: a * 2,
                        w: 6, h: 6
                    });
                }
                addParticle(e.x, e.y - 40, '#ff4400', 5, 3);
            }
        } else {
            e.x -= e.speed;
            e.fireTimer--;
            if (e.fireTimer <= 0) {
                e.fireTimer = 60 + Math.random() * 40;
                enemyBullets.push({
                    x: e.x, y: e.y - 15,
                    vx: -4, vy: 0,
                    w: 5, h: 3
                });
            }
        }

        // Bullet-enemy collision
        for (let j = bullets.length - 1; j >= 0; j--) {
            if (rectsOverlap(bullets[j], {x: e.x, y: e.y - e.h, w: e.w, h: e.h})) {
                e.hp -= bullets[j].damage;
                addParticle(bullets[j].x, bullets[j].y, '#ffcc00', 4, 3);
                bullets.splice(j, 1);

                if (e.hp <= 0) {
                    addExplosion(e.x + e.w / 2, e.y - e.h / 2);
                    const points = e.type === 'boss' ? 500 : (e.type === 'hawk' ? 30 : 20);
                    score += points;

                    // Drop pickup
                    if (Math.random() < 0.3 || e.type === 'boss') {
                        pickups.push({
                            x: e.x, y: e.y - 20,
                            type: Math.random() < 0.5 ? 'health' : 'score',
                            w: 16, h: 16, vy: -3
                        });
                    }

                    if (e.type === 'boss') {
                        bossSpawned = false;
                        bossDefeated = true;
                        level++;
                        enemiesKilled = 0;
                        enemiesForNextLevel = 10 + level * 3;
                        bossDefeated = false;
                    } else {
                        enemiesKilled++;
                    }

                    enemies.splice(i, 1);
                    break;
                }
                break;
            }
        }

        // Enemy-player collision
        if (e.alive && player.hurtTimer <= 0) {
            if (rectsOverlap({x: player.x, y: player.y - player.h, w: player.w, h: player.h},
                             {x: e.x, y: e.y - e.h, w: e.w, h: e.h})) {
                player.hp--;
                player.hurtTimer = 60;
                addParticle(player.x + 20, player.y - 20, '#ff0000', 8, 3);
                if (player.hp <= 0) gameOver();
            }
        }

        // Remove off-screen enemies
        if (e.x < cameraX - 200) {
            enemies.splice(i, 1);
        }
    }

    // Pickups
    for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        p.vy += 0.4;
        p.y += p.vy;
        if (p.y > GROUND_Y) { p.y = GROUND_Y; p.vy = 0; }

        if (rectsOverlap({x: player.x, y: player.y - player.h, w: player.w, h: player.h},
                         {x: p.x, y: p.y - p.h, w: p.w, h: p.h})) {
            if (p.type === 'health' && player.hp < player.maxHp) {
                player.hp++;
                addParticle(player.x + 20, player.y - 25, '#00ff00', 8, 3);
            } else {
                score += 50;
                addParticle(player.x + 20, player.y - 25, '#ffcc00', 8, 3);
            }
            pickups.splice(i, 1);
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // UI
    let hpStr = '';
    for (let i = 0; i < player.maxHp; i++) {
        hpStr += i < player.hp ? '\u2588' : '\u2591';
    }
    document.getElementById('hpBar').textContent = hpStr;
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
    document.getElementById('enemyCount').textContent = `${enemiesKilled}/${enemiesForNextLevel}`;
}

function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// Background
function drawBackground() {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a1a4e');
    grad.addColorStop(0.4, '#4a2080');
    grad.addColorStop(0.7, '#cc5500');
    grad.addColorStop(1, '#ff8844');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 40; i++) {
        const sx = ((i * 137 + 50) % W + W) % W;
        const sy = (i * 97 + 20) % (H * 0.4);
        const blink = Math.sin(Date.now() * 0.003 + i) * 0.5 + 0.5;
        ctx.globalAlpha = blink;
        ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;

    // Mountains (parallax)
    ctx.fillStyle = '#2a1a3a';
    for (let i = 0; i < 8; i++) {
        const mx = ((i * 200 - cameraX * 0.1) % (W + 400)) - 200;
        drawMountain(mx, GROUND_Y + 10, 200 + i * 20, 120 + (i % 3) * 40);
    }

    ctx.fillStyle = '#3a2a4a';
    for (let i = 0; i < 10; i++) {
        const mx = ((i * 150 - cameraX * 0.2) % (W + 300)) - 150;
        drawMountain(mx, GROUND_Y + 10, 150, 80 + (i % 4) * 20);
    }

    // Buildings (parallax)
    ctx.fillStyle = '#1a1a2e';
    for (let i = 0; i < 12; i++) {
        const bx = ((i * 120 - cameraX * 0.35) % (W + 300)) - 150;
        const bh = 60 + (i * 37 % 80);
        ctx.fillRect(bx, GROUND_Y - bh + 10, 50, bh);
        // Windows
        ctx.fillStyle = '#ffcc00';
        for (let wy = 0; wy < bh - 20; wy += 18) {
            for (let wx = 0; wx < 40; wx += 16) {
                if ((i + wx + wy) % 3 !== 0) {
                    ctx.fillRect(bx + 8 + wx, GROUND_Y - bh + 15 + wy, 6, 8);
                }
            }
        }
        ctx.fillStyle = '#1a1a2e';
    }

    // Ground
    ctx.fillStyle = '#3a6e3a';
    ctx.fillRect(0, GROUND_Y + 6, W, H - GROUND_Y);
    ctx.fillStyle = '#4a8e4a';
    ctx.fillRect(0, GROUND_Y + 6, W, 4);
    ctx.fillStyle = '#2a5e2a';
    ctx.fillRect(0, GROUND_Y + 20, W, H);
}

function drawMountain(x, baseY, w, h) {
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x + w / 2, baseY - h);
    ctx.lineTo(x + w, baseY);
    ctx.fill();
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();

    // Platforms
    for (const p of platforms) {
        const px = p.x - cameraX;
        if (px > -p.w && px < W + p.w) {
            ctx.fillStyle = '#5a4a3a';
            ctx.fillRect(px, p.y, p.w, p.h);
            ctx.fillStyle = '#7a6a5a';
            ctx.fillRect(px, p.y, p.w, 3);
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(px + 2, p.y + p.h - 3, p.w - 4, 3);
        }
    }

    // Pickups
    for (const p of pickups) {
        const px = p.x - cameraX;
        if (p.type === 'health') {
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(px + 4, p.y - 12, 8, 8);
            ctx.fillRect(px + 2, p.y - 10, 12, 4);
        } else {
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(px + 8, p.y - 8, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#aa8800';
            ctx.font = '10px monospace';
            ctx.fillText('$', px + 4, p.y - 4);
        }
    }

    // Enemies
    for (const e of enemies) {
        const ex = e.x - cameraX;
        if (ex > -100 && ex < W + 100) {
            drawEnemy(e.x, e.y, e.type, e.frame, e.hp, e.maxHp);
        }
    }

    // Player
    drawPixelChar(player.x, player.y, player.type, player.facing, player.frame, player.hurtTimer > 0);

    // Bullets
    ctx.fillStyle = '#ffcc00';
    for (const b of bullets) {
        const bx = b.x - cameraX;
        ctx.fillRect(bx, b.y, b.w, b.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(bx + (b.vx > 0 ? b.w - 2 : 0), b.y, 2, b.h);
        ctx.fillStyle = '#ffcc00';
    }

    // Enemy bullets
    ctx.fillStyle = '#ff4444';
    for (const b of enemyBullets) {
        const bx = b.x - cameraX;
        ctx.fillRect(bx, b.y, b.w, b.h);
    }

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = p.life / 50;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Boss HP bar
    for (const e of enemies) {
        if (e.type === 'boss') {
            ctx.fillStyle = '#000';
            ctx.fillRect(W / 2 - 152, 12, 304, 22);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(W / 2 - 150, 14, 300, 18);
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(W / 2 - 150, 14, 300 * (e.hp / e.maxHp), 18);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('JEFE - OSO BLINDADO', W / 2, 28);
            ctx.textAlign = 'left';
        }
    }

    // Level transition text
    if (bossDefeated) {
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`NIVEL ${level} COMPLETADO!`, W / 2, H / 2);
        ctx.textAlign = 'left';
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameOver').style.display = 'none';
    initGame();
    gameRunning = true;
}

function gameOver() {
    gameRunning = false;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalLevel').textContent = level;
    document.getElementById('gameOver').style.display = 'block';
}

function restartGame() {
    startGame();
}

gameLoop();
</script>
</body>
</html>
