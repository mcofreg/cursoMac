<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulso — pruebas de dominio</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <style>
    body { padding: 26px; max-width: 820px; margin: 0 auto; }
    .caso { padding: 4px 0 4px 22px; position: relative; font-size: 13px; }
    .caso::before { position: absolute; left: 0; font-weight: 700; }
    .caso.ok::before { content: "\2713"; color: var(--verde); }
    .caso.mal::before { content: "\2717"; color: var(--rojo); }
    .caso.mal { color: var(--rojo); }
    .caso .detalle { display: block; margin-left: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--rojo); }
    .suite { margin-bottom: 20px; }
    .suite h2 { text-transform: capitalize; margin-bottom: 6px; }
  </style>
</head>
<body>
  <h1>Pruebas de dominio de Pulso</h1>
  <p class="suave">Fechas, cadencias, semáforos de alerta y métricas. Todo se calcula en el
     navegador, sin red ni dependencias.</p>
  <div id="marcador" class="kpi mb-24" style="max-width:260px"></div>
  <div id="salida"></div>

  <script type="module">
    import { ejecutar } from './casos.js';

    const { resultados, ok, fallos, total } = ejecutar();
    const salida = document.getElementById('salida');

    for (const suite of resultados) {
      const bloque = document.createElement('section');
      bloque.className = 'suite';
      const titulo = document.createElement('h2');
      titulo.textContent = suite.nombre;
      bloque.appendChild(titulo);
      for (const caso of suite.casos) {
        const fila = document.createElement('div');
        fila.className = 'caso ' + (caso.errores.length ? 'mal' : 'ok');
        fila.textContent = caso.nombre;
        for (const e of caso.errores) {
          const d = document.createElement('span');
          d.className = 'detalle';
          d.textContent = e;
          fila.appendChild(d);
        }
        bloque.appendChild(fila);
      }
      salida.appendChild(bloque);
    }

    const marcador = document.getElementById('marcador');
    marcador.classList.add(fallos ? 'kpi--rojo' : 'kpi--verde');
    marcador.innerHTML = '<div class="kpi__etiqueta">Resultado</div>'
      + '<div class="kpi__valor">' + ok + '/' + total + '</div>'
      + '<div class="kpi__detalle">' + (fallos ? fallos + ' prueba(s) con fallas' : 'todo en verde') + '</div>';
    document.title = (fallos ? 'Fallas' : 'OK') + ' — Pulso ' + ok + '/' + total + ' pruebas';
  </script>
</body>
</html>
