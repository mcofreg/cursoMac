<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Día Vivido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* El día como recorrido del sol: cada pantalla abre con un cielo (mañana, tarde, noche)
   y debajo todo es tranquilo, con tarjetas blancas, línea fina y un solo acento. */
:root {
  --fondo: #e6e9f4;
  --suelo: #f4f6fb;
  --papel: #ffffff;
  --tinta: #141b34;
  --tenue: #5c6585;
  --raya: #e2e6f1;
  --hueco: #e9ecf6;
  --acento: #3550e8;
  --sobre-acento: #ffffff;
  --acento-suave: #e9edff;
  --nutre: #12a26c;
  --sostiene: #e89a0c;
  --drena: #e0507a;
  --sol: #ffae1a;
  --luna: #ffe7a3;
  --marco: #10142a;
  --sombra: 0 1px 2px rgb(20 27 52 / 0.05), 0 12px 26px -16px rgb(20 27 52 / 0.22);
  --sombra-chica: 0 1px 3px rgb(20 27 52 / 0.14);
  --sombra-marco: 0 40px 70px -30px rgb(20 27 52 / 0.45);
  /* cielos */
  --hoy-a: #bfe0ff;
  --hoy-b: #e1efff;
  --hoy-c: #ffe9c4;
  --tarde-a: #ffd9a8;
  --tarde-b: #ffc8b4;
  --tarde-c: #ecc9f3;
  --cielo-tinta: #141b34;
  --cielo-tenue: #3f4a70;
  --noche-a: #131842;
  --noche-b: #252964;
  --noche-c: #463b80;
  --noche-tinta: #f2f3ff;
  --noche-tenue: #bbbfe8;
  --titulo: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --texto: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --fondo: #070a17;
    --suelo: #0e1224;
    --papel: #171c33;
    --tinta: #eceffa;
    --tenue: #9aa3c4;
    --raya: #262d4a;
    --hueco: #232a47;
    --acento: #8a9bff;
    --sobre-acento: #0b1030;
    --acento-suave: #222a57;
    --marco: #000000;
    --sombra: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 26px -16px rgb(0 0 0 / 0.7);
    --sombra-chica: 0 1px 3px rgb(0 0 0 / 0.5);
    --sombra-marco: 0 40px 70px -30px rgb(0 0 0 / 0.9);
    --hoy-a: #16305a;
    --hoy-b: #244678;
    --hoy-c: #5b5270;
    --tarde-a: #5c3d2f;
    --tarde-b: #5e3752;
    --tarde-c: #3c3068;
    --cielo-tinta: #f2f5ff;
    --cielo-tenue: #c5cdec;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --fondo: #070a17;
  --suelo: #0e1224;
  --papel: #171c33;
  --tinta: #eceffa;
  --tenue: #9aa3c4;
  --raya: #262d4a;
  --hueco: #232a47;
  --acento: #8a9bff;
  --sobre-acento: #0b1030;
  --acento-suave: #222a57;
  --marco: #000000;
  --sombra: 0 1px 2px rgb(0 0 0 / 0.3), 0 12px 26px -16px rgb(0 0 0 / 0.7);
  --sombra-chica: 0 1px 3px rgb(0 0 0 / 0.5);
  --sombra-marco: 0 40px 70px -30px rgb(0 0 0 / 0.9);
  --hoy-a: #16305a;
  --hoy-b: #244678;
  --hoy-c: #5b5270;
  --tarde-a: #5c3d2f;
  --tarde-b: #5e3752;
  --tarde-c: #3c3068;
  --cielo-tinta: #f2f5ff;
  --cielo-tenue: #c5cdec;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: grid;
  place-items: center;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--fondo);
  color: var(--tinta);
  font: 400 1rem/1.45 var(--texto);
  -webkit-font-smoothing: antialiased;
}
h1, h2, p, ul, fieldset, legend { margin: 0; padding: 0; }
ul { list-style: none; }
fieldset { border: 0; min-width: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.icono { display: block; width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Marco */
.telefono {
  width: 100%;
  max-width: 404px;
  height: min(100%, 820px);
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  overflow: hidden;
  background: var(--suelo);
  border: 9px solid var(--marco);
  border-radius: 46px;
  box-shadow: var(--sombra-marco);
}
#pantalla { overflow-y: auto; scrollbar-width: none; }
.cielo, .cuerpo, #tabs {
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.cuerpo { display: grid; gap: 22px; padding-block: 20px 28px; }
.cuerpo > * { min-width: 0; }
#tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-block: 8px; background: var(--papel); border-top: 1px solid var(--raya); }

@media (max-width: 480px) {
  body { background: var(--suelo); padding: 0; }
  .telefono { max-width: none; height: 100%; border: 0; border-radius: 0; box-shadow: none; }
}

/* Cielo: la cabecera de cada pantalla */
.cielo { display: grid; gap: 4px; padding-block: 18px 20px; border-radius: 0 0 28px 28px; color: var(--cielo-tinta); background: linear-gradient(180deg, var(--hoy-a), var(--hoy-b) 55%, var(--hoy-c)); }
.cielo--tarde { background: linear-gradient(180deg, var(--tarde-a), var(--tarde-b) 55%, var(--tarde-c)); }
.cielo--noche {
  color: var(--noche-tinta);
  background:
    radial-gradient(1.5px 1.5px at 14% 22%, var(--noche-tinta) 50%, transparent 52%),
    radial-gradient(1px 1px at 31% 58%, var(--noche-tinta) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 52% 16%, var(--noche-tinta) 50%, transparent 52%),
    radial-gradient(1px 1px at 68% 44%, var(--noche-tinta) 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 86% 70%, var(--noche-tinta) 50%, transparent 52%),
    radial-gradient(1px 1px at 8% 78%, var(--noche-tinta) 50%, transparent 52%),
    linear-gradient(180deg, var(--noche-a), var(--noche-b) 55%, var(--noche-c));
}
.cielo__fila { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.cielo__titulo { min-width: 0; display: grid; gap: 4px; }
.sobre { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cielo-tenue); }
.cielo--noche .sobre { color: var(--noche-tenue); }
h1 { font: 700 2rem/1.05 var(--titulo); letter-spacing: -0.02em; text-wrap: balance; }
h2 { font: 600 1.0625rem/1.2 var(--titulo); letter-spacing: -0.01em; }
.cielo__dato { font-size: 0.9375rem; color: var(--cielo-tenue); }
.cielo__dato strong { color: var(--cielo-tinta); font-weight: 700; font-variant-numeric: tabular-nums; }
.ejemplo { justify-self: start; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; margin-bottom: 10px; padding: 5px 12px; border-radius: 999px; background: color-mix(in srgb, var(--papel) 72%, transparent); color: var(--tenue); font-size: 0.75rem; font-weight: 600; }
.enlace { color: var(--acento); font-weight: 700; }
.enlace:hover { text-decoration: underline; text-underline-offset: 3px; }

.arco { display: block; width: 100%; height: auto; margin-top: 2px; }
.arco__ruta { fill: none; stroke: var(--cielo-tenue); stroke-opacity: 0.5; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 1 7; }
.arco__halo { fill: var(--sol); fill-opacity: 0.25; }
.arco__sol { fill: var(--sol); }

.luna { flex: none; width: 46px; height: 46px; border-radius: 50%; box-shadow: inset 13px -7px 0 0 var(--luna); rotate: -18deg; }

.marcador { position: relative; flex: none; display: grid; place-content: center; justify-items: center; width: 104px; height: 104px; }
.anillo { position: absolute; inset: 0; width: 100%; height: 100%; rotate: -90deg; }
.anillo__fondo, .anillo__valor { fill: none; stroke-width: 10; }
.anillo__fondo { stroke: var(--cielo-tinta); stroke-opacity: 0.14; }
.anillo__valor { stroke: var(--cielo-tinta); stroke-linecap: round; }
.sol__num { font: 800 2.25rem/0.95 var(--titulo); font-variant-numeric: tabular-nums; }
.sol__de { font-size: 0.6875rem; font-weight: 600; color: var(--cielo-tenue); }

/* Piezas comunes */
.tarjeta { background: var(--papel); border: 1px solid var(--raya); border-radius: 20px; box-shadow: var(--sombra); }
.bloque { display: grid; gap: 12px; }
.vacio { padding: 18px; border: 1px dashed color-mix(in srgb, var(--tenue) 55%, transparent); border-radius: 16px; color: var(--tenue); font-size: 0.9375rem; text-align: center; }
.aviso { padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--drena) 45%, var(--papel)); border-radius: 12px; background: color-mix(in srgb, var(--drena) 12%, var(--papel)); font-size: 0.875rem; font-weight: 600; }
.forma { flex: none; display: inline-block; width: 10px; height: 10px; }
.forma--nutre { background: var(--nutre); border-radius: 50%; }
.forma--sostiene { background: var(--sostiene); border-radius: 2.5px; }
.forma--drena { background: var(--drena); clip-path: polygon(50% 4%, 100% 96%, 0 96%); }

.boton { width: 100%; padding: 14px 18px; border-radius: 14px; background: var(--acento); color: var(--sobre-acento); font-weight: 600; box-shadow: 0 10px 18px -12px var(--acento); transition: scale 0.12s; }
.boton:active { scale: 0.98; }
.boton--noche { background: var(--tinta); color: var(--suelo); box-shadow: none; }
.boton--suave { background: var(--papel); color: var(--tinta); border: 1px solid var(--raya); box-shadow: none; }

/* Hoy */
.reparto { display: grid; gap: 14px; padding: 16px; }
.barra { display: flex; gap: 3px; height: 12px; overflow: hidden; border-radius: 999px; background: var(--hueco); }
.barra__seg { border-radius: 999px; }
.barra__seg--nutre { background: var(--nutre); }
.barra__seg--sostiene { background: var(--sostiene); }
.barra__seg--drena { background: var(--drena); }
.leyenda { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.leyenda__item { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 6px; font-size: 0.75rem; color: var(--tenue); }
.leyenda b { grid-column: 1 / -1; font: 700 1.0625rem/1.2 var(--titulo); color: var(--tinta); font-variant-numeric: tabular-nums; }

.fichas { overflow: hidden; }
.ficha { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
.ficha + .ficha { border-top: 1px solid var(--raya); }
.ficha--nutre { --tipo: var(--nutre); }
.ficha--sostiene { --tipo: var(--sostiene); }
.ficha--drena { --tipo: var(--drena); }
.ficha__main { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 12px 4px 12px 14px; text-align: left; }
.ficha__main:hover:not(:disabled) { background: color-mix(in srgb, var(--hueco) 55%, transparent); }
.check { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border: 2px solid var(--tipo); border-radius: 50%; color: transparent; }
.check .icono { width: 15px; height: 15px; stroke-width: 3.2; }
.is-done .check { background: var(--tipo); color: var(--papel); }
.ficha__text { min-width: 0; display: grid; gap: 1px; }
.ficha__name { font-weight: 600; overflow-wrap: anywhere; }
.ficha__meta { font-size: 0.8125rem; color: var(--tenue); font-variant-numeric: tabular-nums; }
.ficha__remove { display: grid; place-items: center; width: 44px; color: var(--tenue); opacity: 0.65; }
.ficha__remove:hover:not(:disabled) { opacity: 1; color: var(--drena); }
.ficha__remove .icono { width: 16px; height: 16px; }
.ficha button:disabled { opacity: 0.55; }

.nueva { display: grid; gap: 16px; padding: 16px; }
.nueva__label { font: 600 1.0625rem/1.2 var(--titulo); letter-spacing: -0.01em; }
.campo { width: 100%; padding: 12px 14px; border: 1px solid var(--raya); border-radius: 12px; background: var(--suelo); font-weight: 500; }
.campo::placeholder { color: var(--tenue); font-weight: 400; opacity: 1; }
.campo:focus-visible { outline-offset: 0; border-color: var(--acento); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips legend { margin-bottom: 8px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tenue); }
.chip__input { position: absolute; opacity: 0; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border: 1px solid var(--raya); border-radius: 999px; background: var(--papel); font-size: 0.875rem; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; }
.chip__input:checked + .chip { border-color: var(--tinta); background: var(--tinta); color: var(--suelo); }
.chip__input:checked + .chip--nutre { border-color: var(--nutre); background: color-mix(in srgb, var(--nutre) 15%, var(--papel)); color: var(--tinta); }
.chip__input:checked + .chip--sostiene { border-color: var(--sostiene); background: color-mix(in srgb, var(--sostiene) 17%, var(--papel)); color: var(--tinta); }
.chip__input:checked + .chip--drena { border-color: var(--drena); background: color-mix(in srgb, var(--drena) 14%, var(--papel)); color: var(--tinta); }
.chip__input:focus-visible + .chip { outline: 2px solid var(--acento); outline-offset: 2px; }

/* Espejo */
.partes { display: grid; gap: 16px; padding: 16px; }
.parte { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; }
.parte__label { font-weight: 600; }
.parte__num { grid-row: 1; grid-column: 2; font-size: 0.8125rem; font-weight: 600; color: var(--tenue); font-variant-numeric: tabular-nums; }
.parte__hint { grid-column: 1 / -1; font-size: 0.8125rem; color: var(--tenue); }
.medidor { grid-column: 1 / -1; height: 6px; margin-top: 6px; overflow: hidden; border-radius: 999px; background: var(--hueco); }
.medidor__lleno { display: block; height: 100%; border-radius: 999px; background: var(--acento); }

.preguntas { display: grid; gap: 10px; }
.pregunta { position: relative; padding: 14px 16px 14px 48px; border-radius: 16px; background: var(--acento-suave); font-weight: 500; line-height: 1.4; }
.pregunta::before { content: '?'; position: absolute; left: 14px; top: 13px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--acento); color: var(--sobre-acento); font: 700 0.875rem/1 var(--titulo); }

.veredicto { display: grid; gap: 10px; padding: 14px 16px; }
.veredicto + .veredicto { border-top: 1px solid var(--raya); }
.veredicto__name { display: flex; align-items: center; gap: 8px; font-weight: 600; overflow-wrap: anywhere; }
.veredicto__opciones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: var(--hueco); }
.opcion { padding: 8px 4px; border-radius: 9px; font-size: 0.8125rem; font-weight: 600; color: var(--tenue); }
.opcion[aria-pressed='true'] { background: var(--papel); color: var(--tinta); box-shadow: var(--sombra-chica); }

/* Noche */
.gracias { padding: 4px 16px; }
.gracia { display: flex; align-items: center; gap: 12px; }
.gracia + .gracia { border-top: 1px solid var(--raya); }
.gracia__n { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--hueco); color: var(--tenue); font-size: 0.75rem; font-weight: 700; }
.gracia .campo { padding: 14px 0; border: 0; border-radius: 0; background: none; }
.gracia .campo:focus-visible { outline: 0; }
.gracia:focus-within .gracia__n { background: var(--acento); color: var(--sobre-acento); }
.animos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.animo { display: grid; justify-items: center; gap: 6px; padding: 14px 6px 12px; border: 1px solid var(--raya); border-radius: 16px; background: var(--papel); color: var(--tenue); font-size: 0.875rem; font-weight: 600; box-shadow: var(--sombra); }
.animo .icono { width: 30px; height: 30px; stroke-width: 1.8; }
.animo[aria-pressed='true'] { border-color: var(--acento); background: var(--acento-suave); color: var(--tinta); }
.animo[aria-pressed='true'] .icono { color: var(--acento); }

.cierre { justify-items: center; gap: 8px; padding-block: 18px 34px; text-align: center; }
.cierre .ejemplo { justify-self: start; }
.cierre .sobre { margin-top: 10px; }
.cierre__num { font-size: 1.125rem; font-weight: 600; letter-spacing: 0; color: var(--noche-tenue); }
.cierre__num strong { display: block; font: 800 5.5rem/0.95 var(--titulo); letter-spacing: -0.03em; color: var(--noche-tinta); font-variant-numeric: tabular-nums; }
.cierre__animo { color: var(--noche-tenue); }
.agradecido li { padding: 14px 16px; font-weight: 500; overflow-wrap: anywhere; }
.agradecido li + li { border-top: 1px solid var(--raya); }

/* Pestañas */
.tab { display: grid; justify-items: center; gap: 3px; padding: 8px 4px 7px; border-radius: 14px; color: var(--tenue); font-size: 0.6875rem; font-weight: 600; }
.tab .icono { width: 22px; height: 22px; }
.tab[aria-current='page'] { background: var(--acento-suave); color: var(--acento); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="telefono">
  <main id="pantalla"></main>
  <nav id="tabs" aria-label="Secciones"></nav>
</div>
<script>
const __logic = (() => {
// Dominio de Día Vivido. Funciones puras: reciben un día y devuelven otro.
//
// Glosario
//   ficha       una dedicación del día: nombre, minutos y tipo.
//   tipo        qué te hace la ficha: te nutre, te sostiene o te drena.
//   resultado   cómo va la ficha: pendiente, hecha, o hecha con veredicto
//               (valió, tibio, no valió). Un solo campo: no existe veredicto sin hacerla.
//   reparto     minutos del día sumados por tipo.
//   puntaje     qué tan vivido fue el día, de 0 a 100: presencia + nutrición + gratitud.
//   cierre      agradecer y elegir un ánimo. Un día cerrado no se edita.

const KINDS = ['nutre', 'sostiene', 'drena'];
const VERDICTS = ['valio', 'tibio', 'novalio'];
const MOODS = ['feliz', 'tranquilo', 'inquieto'];

// Cuánto cuenta cada resultado para la presencia. Sus claves son los resultados válidos.
const WEIGHT = { pendiente: 0, hecha: 1, valio: 1, tibio: 0.5, novalio: 0 };

const sum = (list, amount) => list.reduce((total, item) => total + amount(item), 0);
const isDone = (activity) => activity.outcome !== 'pendiente';
const isWritten = (text) => text.trim() !== '';
const fail = (error) => ({ ok: false, error });
const edit = (day, change) => (day.closed ? day : change(day));

const emptyDay = () => ({ activities: [], gratitudes: ['', '', ''], mood: null, closed: false });

// Frontera: lo que escribe la persona entra por aquí una sola vez.
function parseActivity(input) {
  const name = String(input.name || '').trim();
  const minutes = Number(input.minutes);
  if (name === '') return fail('Ponle un nombre a la ficha.');
  if (!Number.isInteger(minutes) || minutes < 5 || minutes > 720) {
    return fail('La duración va de 5 minutos a 12 horas.');
  }
  if (!KINDS.includes(input.kind)) return fail('Elige si te nutre, te sostiene o te drena.');
  return { ok: true, value: { name, minutes, kind: input.kind } };
}

const addActivity = (day, value) =>
  edit(day, () => {
    const id = Math.max(0, ...day.activities.map((a) => a.id)) + 1;
    return { ...day, activities: [...day.activities, { id, ...value, outcome: 'pendiente' }] };
  });

const setOutcome = (day, id, outcome) =>
  edit(day, () =>
    Object.hasOwn(WEIGHT, outcome)
      ? { ...day, activities: day.activities.map((a) => (a.id === id ? { ...a, outcome } : a)) }
      : day,
  );

const removeActivity = (day, id) =>
  edit(day, () => ({ ...day, activities: day.activities.filter((a) => a.id !== id) }));

const setGratitude = (day, index, text) =>
  edit(day, () => ({ ...day, gratitudes: day.gratitudes.map((old, i) => (i === index ? text : old)) }));

const setMood = (day, mood) => edit(day, () => (MOODS.includes(mood) ? { ...day, mood } : day));

const canClose = (day) => day.mood !== null && day.gratitudes.some(isWritten);

  tab: (state, { value }) => (TABS.includes(value) ? { ...state, tab: value } : state),
  // Los campos del borrador se llaman como sus claves; los agradecimientos, 0, 1 y 2.
  field: (state, { name, value }) =>
    Object.hasOwn(state.draft, name)
      ? { ...state, draft: { ...state.draft, [name]: value } }

  add: (state) => {

    return parsed.ok
      ? { ...withDay(state, L.addActivity(state.day, parsed.value)), draft: DRAFT }
      : { ...state, error: parsed.error };
  },
  outcome: (state, { id, value }) => withDay(state, L.setOutcome(state.day, Number(id), value)),
  remove: (state, { id }) => withDay(state, L.removeActivity(state.day, Number(id))),
  mood: (state, { value }) => withDay(state, L.setMood(state.day, value)),
  close: (state) =>
    L.canClose(state.day)
      ? withDay(state, L.closeDay(state.day))
      : { ...state, error: 'Escribe al menos un agradecimiento y elige cómo te acuestas.' },
  reopen: (state) => withDay(state, L.reopenDay(state.day)),
  blank: (state) => ({ ...initialState(), day: L.emptyDay(), example: false, tab: state.tab }),
};

function update(state, action) {
  const handler = Object.hasOwn(HANDLERS, action.type) ? HANDLERS[action.type] : null;
  return handler ? handler({ ...state, error: null }, action) : state;
