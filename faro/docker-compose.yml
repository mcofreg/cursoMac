services:
  postgres:
    image: postgres:16-alpine
    container_name: faro-postgres
    environment:
      POSTGRES_USER: faro
      POSTGRES_PASSWORD: faro
      POSTGRES_DB: faro
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U faro']
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor de páginas de prueba: simula las aplicaciones internas del banco
  # donde la extensión inyecta la huincha.
  sitio-prueba:
    image: nginx:alpine
    container_name: faro-sitio-prueba
    ports:
      - '8080:80'
    volumes:
      - ./sitio-prueba:/usr/share/nginx/html:ro

  # MinIO queda listo para cuando se pase de almacenamiento local a S3.
  # No es necesario para el prototipo (STORAGE_DRIVER=local).
  minio:
    image: minio/minio:latest
    container_name: faro-minio
    profiles: ['s3']
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: faro
      MINIO_ROOT_PASSWORD: faro-secreto
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
