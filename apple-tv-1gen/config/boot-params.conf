# =============================================================================
# Parámetros de arranque del kernel Linux para Apple TV 1ra Generación
# =============================================================================
#
# Cada línea no comentada se concatena como parámetro del kernel.
# Modifica según tu configuración.
#

# Partición raíz (ajusta según tu instalación)
root=/dev/sda2

# Modo de solo lectura inicial (se remonta como rw después)
ro

# Reducir verbosidad del boot
quiet

# Resolución de video (720p para Apple TV)
video=efifb:mode=1

# Forzar modo de video compatible con el Nvidia GeForce Go 7300
# Descomenta si tienes problemas de video:
# nomodeset
# video=1280x720@60

# Habilitar framebuffer EFI
# efi=runtime

# Consola serie para depuración (descomenta si necesitas debug)
# console=ttyS0,115200n8
